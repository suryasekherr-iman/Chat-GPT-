<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mera AI Assistant</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
                body { background-color: #212121; color: #ececec; display: flex; flex-direction: column; height: 100dvh; }
                    header { padding: 12px 16px; background-color: #171717; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
                        header h1 { font-size: 1rem; font-weight: 600; }
                            .btn-key { background: #343541; border: 1px solid #565869; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
                                #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 800px; width: 100%; margin: 0 auto; }
                                    .message { padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; max-width: 85%; word-wrap: break-word; white-space: pre-wrap; }
                                        .user-msg { background-color: #2f2f2f; align-self: flex-end; border-bottom-right-radius: 2px; }
                                            .ai-msg { background-color: #181818; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
                                                .input-area { padding: 12px; background-color: #212121; display: flex; justify-content: center; }
                                                    .input-box { display: flex; width: 100%; max-width: 800px; background: #2f2f2f; border-radius: 24px; padding: 6px 12px; border: 1px solid #444; align-items: center; }
                                                        textarea { flex: 1; background: transparent; border: none; color: #fff; padding: 8px; resize: none; font-size: 1rem; outline: none; height: 24px; max-height: 120px; }
                                                            button.send-btn { background: #fff; color: #000; border: none; border-radius: 50%; width: 34px; height: 34px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
                                                              </style>
                                                              </head>
                                                              <body>

                                                                <header>
                                                                    <h1>🤖 Mera AI Assistant</h1>
                                                                        <button class="btn-key" onclick="setupAPIKey()">🔑 API Key Badlein</button>
                                                                          </header>

                                                                            <div id="chat-container">
                                                                                <div class="message ai-msg">Namaste! Main aapka AI Assistant hoon. Kuch bhi puchhiye!</div>
                                                                                  </div>

                                                                                    <div class="input-area">
                                                                                        <div class="input-box">
                                                                                              <textarea id="prompt-input" rows="1" placeholder="Yahan message likhein..."></textarea>
                                                                                                    <button id="send-btn" class="send-btn" onclick="sendMessage()">➔</button>
                                                                                                        </div>
                                                                                                          </div>

                                                                                                            <script>
                                                                                                                let API_KEY = localStorage.getItem("ChatGPT_KEY") || "";

                                                                                                                    function setupAPIKey() {
                                                                                                                          const key = prompt("Apni Free OpenAI Studio API Key yahan dalein:", API_KEY);
                                                                                                                                if (key) {
                                                                                                                                        API_KEY = key.trim();
                                                                                                                                                localStorage.setItem("ChatGPT_KEY", API_KEY);
                                                                                                                                                        alert("API Key save ho gayi!");
                                                                                                                                                              }
                                                                                                                                                                  }

                                                                                                                                                                      async function sendMessage() {
                                                                                                                                                                            const input = document.getElementById("prompt-input");
                                                                                                                                                                                  const message = input.value.trim();
                                                                                                                                                                                        const chat = document.getElementById("chat-container");
                                                                                                                                                                                              const sendBtn = document.getElementById("send-btn");

                                                                                                                                                                                                    if (!message) return;

                                                                                                                                                                                                          if (!API_KEY) {
                                                                                                                                                                                                                  setupAPIKey();
                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                      appendMessage(message, "user-msg");
                                                                                                                                                                                                                                            input.value = "";
                                                                                                                                                                                                                                                  sendBtn.disabled = true;

                                                                                                                                                                                                                                                        const aiDiv = appendMessage("Soch raha hoon...", "ai-msg");

                                                                                                                                                                                                                                                              try {
                                                                                                                                                                                                                                                                      const url = `https://generativelanguage.googleapis.com/v1beta/models/ChatGPT 5.6:generateContent?key=${API_KEY}`;
                                                                                                                                                                                                                                                                              const res = await fetch(url, {
                                                                                                                                                                                                                                                                                        method: "POST",
                                                                                                                                                                                                                                                                                                  headers: { "Content-Type": "application/json" },
                                                                                                                                                                                                                                                                                                            body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                            const data = await res.json();
                                                                                                                                                                                                                                                                                                                                    if (data.error) {
                                                                                                                                                                                                                                                                                                                                              aiDiv.innerText = "Error: " + data.error.message;
                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                aiDiv.innerText = data.candidates[0].content.parts[0].text;
                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                              } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                      aiDiv.innerText = "Error: Kripya internet ya API Key check karein.";
                                                                                                                                                                                                                                                                                                                                                                                            } finally {
                                                                                                                                                                                                                                                                                                                                                                                                    sendBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                            chat.scrollTop = chat.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                          function appendMessage(text, className) {
                                                                                                                                                                                                                                                                                                                                                                                                                                const chat = document.getElementById("chat-container");
                                                                                                                                                                                                                                                                                                                                                                                                                                      const msg = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                            msg.className = `message ${className}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  msg.innerText = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        chat.appendChild(msg);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              chat.scrollTop = chat.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return msg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
